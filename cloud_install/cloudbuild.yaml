# Event Mill — Cloud Build CI/CD (provision-aligned)
# =============================================================================
# The build config for this project. Mirrors the SAME derivation rules as
# cloud_install/provision-gcp-project.sh, so a deploy can never drift from
# what was actually provisioned.
#
# Supersedes cloudbuild.yaml.bak, which defaulted _REGION and allowed an empty
# _BUCKET_PREFIX — a trigger wired with those defaults produced a service that
# started cleanly and read buckets that did not exist.
#
# Derivation rules, matching provision-gcp-project.sh:
#   PROJECT_ID     = $PROJECT_ID                     (Cloud Build built-in)
#   REGION         = _REGION                          REQUIRED, never guessed
#
# Cloud Build cannot read your shell environment, so pass the same values you
# exported for provisioning as substitutions. _REGION has no default: the
# Artifact Registry path embeds the region, so guessing it is the documented
# root cause of "Repository not found" after a full paid build.
#
# Usage — source your saved config first, then submit:
#   source ~/.eventmill/deploy.env
#   gcloud builds submit \
#       --project="${GOOGLE_CLOUD_PROJECT}" \
#       --config=cloud_install/cloudbuild.yaml \
#       --substitutions="_REGION=${CLOUD_RUN_REGION},_BUCKET_PREFIX=${EVENTMILL_BUCKET_PREFIX}" \
#       .
#
# When wiring a Cloud Build TRIGGER, set _REGION and _BUCKET_PREFIX in the
# trigger's substitution config. A trigger left on the defaults fails the
# preflight below rather than deploying something wrong.
#
# An empty _BUCKET_PREFIX resolves to ${PROJECT_ID}-eventmill rather than the
# empty string, so the service can never start up pointed at bucket names
# derived from an empty prefix.
#
# NOTE: shell variables are written $$VAR because Cloud Build consumes a single
# leading $. Single-$ tokens (${_REGION}, ${PROJECT_ID}) are substitutions.
# =============================================================================

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Resolve configuration and preflight the provisioned resources
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'resolve-config'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        REGION="${_REGION}"
        BUCKET_PREFIX="${_BUCKET_PREFIX}"
        SERVICE_NAME="${_SERVICE_NAME}"
        SA_NAME="${_SA_NAME}"
        AR_REPO="${_AR_REPO}"

        # Region is never guessed — see the header. provision-gcp-project.sh
        # refuses without it, and the two must not drift.
        if [ -z "$${REGION}" ]; then
          echo "ERROR: _REGION is not set and has no default."
          echo ""
          echo "  --substitutions=_REGION=<the region you provisioned in>"
          echo ""
          echo "Provisioned Artifact Registry repos in this project:"
          gcloud artifacts repositories list --project="${PROJECT_ID}" \
              --format="value(name.basename(), location)" 2>/dev/null \
              | sed 's/^/    repo: /' || true
          exit 1
        fi

        # Same fallbacks as provision-gcp-project.sh
        [ -n "$${BUCKET_PREFIX}" ] || BUCKET_PREFIX="${PROJECT_ID}-eventmill"
        [ -n "$${SERVICE_NAME}" ]  || SERVICE_NAME="event-mill"
        [ -n "$${SA_NAME}" ]       || SA_NAME="eventmill-runner"
        [ -n "$${AR_REPO}" ]       || AR_REPO="eventmill"

        SA_EMAIL="$${SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"
        IMAGE="$${REGION}-docker.pkg.dev/${PROJECT_ID}/$${AR_REPO}/$${SERVICE_NAME}"

        echo "Resolved deploy configuration"
        echo "  Project:       ${PROJECT_ID}"
        echo "  Region:        $${REGION}"
        echo "  Bucket prefix: $${BUCKET_PREFIX}"
        echo "  Service:       $${SERVICE_NAME}"
        echo "  Service acct:  $${SA_EMAIL}"
        echo "  Image:         $${IMAGE}"
        echo ""

        # --- Preflight: fail loudly now rather than silently misbehave later ---
        FAILED=0

        # Artifact Registry must exist in the resolved region, or the push fails
        # after a full image build has already been paid for.
        if ! gcloud artifacts repositories describe "$${AR_REPO}" \
                --project="${PROJECT_ID}" \
                --location="$${REGION}" > /dev/null 2>&1; then
          echo "ERROR: Artifact Registry repo '$${AR_REPO}' not found in $${REGION}."
          echo "       The region must match the one used for provisioning."
          echo "       Re-run with: --substitutions=_REGION=<provisioned-region>"
          FAILED=1
        else
          echo "OK: Artifact Registry $${REGION}-docker.pkg.dev/${PROJECT_ID}/$${AR_REPO}"
        fi

        # Runtime service account must exist
        if ! gcloud iam service-accounts describe "$${SA_EMAIL}" \
                --project="${PROJECT_ID}" > /dev/null 2>&1; then
          echo "ERROR: Service account $${SA_EMAIL} not found."
          echo "       Run cloud_install/provision-gcp-project.sh first."
          FAILED=1
        else
          echo "OK: Service account $${SA_EMAIL}"
        fi

        # Every injected secret must exist, else Cloud Run rejects the revision
        for SECRET in "${_SECRET_GEMINI_FLASH}" "${_SECRET_GEMINI_PRO}" \
                      "${_SECRET_TTYD_USER}" "${_SECRET_TTYD_CRED}"; do
          if ! gcloud secrets describe "$${SECRET}" --project="${PROJECT_ID}" > /dev/null 2>&1; then
            echo "ERROR: Secret '$${SECRET}' not found."
            FAILED=1
          else
            echo "OK: Secret $${SECRET}"
          fi
        done

        # Buckets the resolved prefix implies must exist, or file lookups return
        # nothing at runtime with no error surfaced to the analyst.
        for SLUG in log-analysis network-forensics threat-modeling common; do
          if ! gcloud storage buckets describe "gs://$${BUCKET_PREFIX}-$${SLUG}" > /dev/null 2>&1; then
            echo "ERROR: Bucket gs://$${BUCKET_PREFIX}-$${SLUG} not found."
            echo "       _BUCKET_PREFIX must match EVENTMILL_BUCKET_PREFIX used at provisioning."
            FAILED=1
          else
            echo "OK: Bucket gs://$${BUCKET_PREFIX}-$${SLUG}"
          fi
        done

        if [ "$${FAILED}" -ne 0 ]; then
          echo ""
          echo "Preflight failed — aborting before build. Nothing was deployed."
          exit 1
        fi

        echo ""
        echo "Preflight passed."

        # Hand the resolved values to later steps via the shared /workspace volume
        {
          echo "REGION=$${REGION}"
          echo "BUCKET_PREFIX=$${BUCKET_PREFIX}"
          echo "SERVICE_NAME=$${SERVICE_NAME}"
          echo "SA_EMAIL=$${SA_EMAIL}"
          echo "IMAGE=$${IMAGE}"
        } > /workspace/deploy.env

  # ---------------------------------------------------------------------------
  # Step 2: Build the image (commit-tagged + latest)
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        source /workspace/deploy.env

        docker build \
          -t "$${IMAGE}:$COMMIT_SHA" \
          -t "$${IMAGE}:latest" \
          -f cloud_install/Dockerfile.cloudrun \
          .
    waitFor: ['resolve-config']

  # ---------------------------------------------------------------------------
  # Step 3: Push both tags to Artifact Registry
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        source /workspace/deploy.env

        docker push "$${IMAGE}:$COMMIT_SHA"
        docker push "$${IMAGE}:latest"
    waitFor: ['build']

  # ---------------------------------------------------------------------------
  # Step 4: Deploy to Cloud Run
  # ---------------------------------------------------------------------------
  # Runtime flags match deploy-cloudrun-secrets.sh:
  #   --no-cpu-throttling  keeps LLM calls running between websocket frames
  #   --session-affinity   pins an analyst's terminal to one instance
  #   --timeout 3600       long-running interactive investigations
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        source /workspace/deploy.env

        AUTH_FLAG="--no-allow-unauthenticated"
        if [ "${_ALLOW_UNAUTHENTICATED}" = "true" ]; then
          AUTH_FLAG="--allow-unauthenticated"
        fi

        gcloud run deploy "$${SERVICE_NAME}" \
          --project="${PROJECT_ID}" \
          --region="$${REGION}" \
          --image="$${IMAGE}:$COMMIT_SHA" \
          --platform=managed \
          --port=8080 \
          --memory=2Gi \
          --cpu=2 \
          --no-cpu-throttling \
          --timeout=3600 \
          --concurrency=5 \
          --session-affinity \
          --min-instances=0 \
          --max-instances=3 \
          --service-account="$${SA_EMAIL}" \
          --set-secrets="GEMINI_FLASH_API_KEY=${_SECRET_GEMINI_FLASH}:latest,GEMINI_PRO_API_KEY=${_SECRET_GEMINI_PRO}:latest,TTYD_USERNAME=${_SECRET_TTYD_USER}:latest,TTYD_PASSWORD=${_SECRET_TTYD_CRED}:latest" \
          --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},EVENTMILL_BUCKET_PREFIX=$${BUCKET_PREFIX},EVENTMILL_LOG_LEVEL=${_LOG_LEVEL}" \
          "$${AUTH_FLAG}"

        SERVICE_URL=$$(gcloud run services describe "$${SERVICE_NAME}" \
          --project="${PROJECT_ID}" \
          --region="$${REGION}" \
          --format="value(status.url)")

        echo ""
        echo "Deployed $${SERVICE_NAME} to $${REGION}"
        echo "  URL:           $${SERVICE_URL}"
        echo "  Image:         $${IMAGE}:$COMMIT_SHA"
        echo "  Bucket prefix: $${BUCKET_PREFIX}"
    waitFor: ['push']

# GCS_LOG_BUCKET is deliberately not set: the resolver treats a non-empty value
# as a legacy log_analysis override, and passing it empty adds no value.

substitutions:
  # Leave empty to inherit the provision-gcp-project.sh default for each value.
  _REGION: ''                 # REQUIRED — no default; build fails fast if empty
  _BUCKET_PREFIX: ''          # EVENTMILL_BUCKET_PREFIX -> ${PROJECT_ID}-eventmill
  _SERVICE_NAME: ''           # fixed in provisioning   -> event-mill
  _SA_NAME: ''                # fixed in provisioning   -> eventmill-runner
  _AR_REPO: ''                # fixed in provisioning   -> eventmill

  # Secret names as created by provision-gcp-project.sh Section 6
  _SECRET_GEMINI_FLASH: 'eventmill-gemini-flash-api'
  _SECRET_GEMINI_PRO: 'eventmill-gemini-pro-api'
  _SECRET_TTYD_USER: 'eventmill-ttyd-user'
  _SECRET_TTYD_CRED: 'eventmill-ttyd-cred'

  _LOG_LEVEL: 'INFO'

  # Set to 'false' to require IAM auth (roles/run.invoker) instead of relying
  # on ttyd basic auth alone.
  _ALLOW_UNAUTHENTICATED: 'true'

timeout: 2400s

options:
  logging: CLOUD_LOGGING_ONLY
