version: '3.8'

services:
  eventmill:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./workspace:/app/workspace
      - ./.env:/app/.env:ro
    environment:
      - EVENTMILL_MCP_TRANSPORT=${EVENTMILL_MCP_TRANSPORT:-stdio}
      # Nothing reads EVENTMILL_MODEL_ID. Model ids come from
      # framework/llm/providers/gcp_gemini.json, overridden per tier by
      # EVENTMILL_MODEL_LIGHT / EVENTMILL_MODEL_HEAVY.
      - EVENTMILL_LOG_LEVEL=${EVENTMILL_LOG_LEVEL:-INFO}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    stdin_open: true
    tty: true

  # Development mode with hot reload
  eventmill-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./framework:/app/framework
      - ./plugins:/app/plugins
      - ./workspace:/app/workspace
      - ./.env:/app/.env:ro
    environment:
      - EVENTMILL_MCP_TRANSPORT=${EVENTMILL_MCP_TRANSPORT:-stdio}
      # Nothing reads EVENTMILL_MODEL_ID. Model ids come from
      # framework/llm/providers/gcp_gemini.json, overridden per tier by
      # EVENTMILL_MODEL_LIGHT / EVENTMILL_MODEL_HEAVY.
      - EVENTMILL_LOG_LEVEL=DEBUG
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    stdin_open: true
    tty: true
    profiles:
      - dev
