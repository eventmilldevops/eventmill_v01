# Build config for threatbrief-fusion deployment
# Usage: gcloud builds submit --project=YOUR_PROJECT_ID --config=build-threatbrief-fusion.yaml .
#
# Override the region with --substitutions="_REGION=<region>" if it differs from
# the default below; it must match the region the project was provisioned in.

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eventmill/threatbrief-fusion:latest'
      - '-f'
      - 'cloud_install/Dockerfile.cloudrun'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eventmill/threatbrief-fusion:latest'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eventmill/threatbrief-fusion:latest'

substitutions:
  _REGION: northamerica-northeast2

options:
  logging: CLOUD_LOGGING_ONLY
